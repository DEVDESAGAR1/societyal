name: Staged Cloud Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

jobs:
  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_DEV }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and Deploy to Cloud Run
        run: |
          gcloud builds submit --config=cloudbuild-deploy.yaml \
            --substitutions=_REGION=asia-south1,_ENVIRONMENT=dev,_SERVICE_NAME=societyfix-dev-api,_REPO_NAME=societyfix-dev

  deploy-staging:
    name: Promote to Staging
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_STAGING }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and Deploy to Staging
        run: |
          gcloud builds submit --config=cloudbuild-deploy.yaml \
            --substitutions=_REGION=asia-south1,_ENVIRONMENT=staging,_SERVICE_NAME=societyfix-staging-api,_REPO_NAME=societyfix-staging

  deploy-prod:
    name: Deploy to Production (Approval Required)
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production # Protected environment requiring manual approval
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_PROD }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Production Cloud Run
        run: |
          gcloud builds submit --config=cloudbuild-deploy.yaml \
            --substitutions=_REGION=asia-south1,_ENVIRONMENT=prod,_SERVICE_NAME=societyfix-prod-api,_REPO_NAME=societyfix-prod
